name: Bulk Generate Articles

on:
  workflow_dispatch:       # run manually from GitHub
  schedule:
    - cron: '0 1 * * *'   # 1am UTC every night

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx fastapi jinja2 psycopg2-binary

      - name: Generate articles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bulk_generate.py

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rome.sqlite3
          git diff --cached --quiet || git commit -m "chore: generated articles [skip ci]"
          git push
